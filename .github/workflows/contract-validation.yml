name: contract-validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "templates/**/DESIGN.md"
      - "examples/**/DESIGN.md"
      - "fixtures/**"
      - "validators/contract.py"
      - "schema/design-contract.schema.json"
      - "tests/**"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/contract-validation.yml"
  push:
    branches:
      - main
    paths:
      - "templates/**/DESIGN.md"
      - "examples/**/DESIGN.md"
      - "fixtures/**"
      - "validators/contract.py"
      - "schema/design-contract.schema.json"
      - "tests/**"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/contract-validation.yml"

concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shipped templates and examples
        run: |
          python validators/contract.py validate --strict \
            templates/base/DESIGN.md \
            templates/media/DESIGN.md \
            templates/saas/DESIGN.md \
            templates/docs/DESIGN.md \
            templates/dashboard/DESIGN.md \
            examples/sample-media/DESIGN.md \
            examples/sample-saas/DESIGN.md
      - name: Run validator tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  rendered-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright test runner
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run rendered UI gates
        run: npm run test:rendered
      - name: Upload rendered validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-validation-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
